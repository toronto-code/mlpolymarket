seed: 42

data:
  polymarket_trades: data/polymarket/trades
  polymarket_blocks: data/polymarket/blocks
  polymarket_markets: data/polymarket/markets
  last_n_months: 12
  exclude_sports: true
  polymarket_sports_tickers_file: data/polymarket/sports_tickers.txt
  batch_by_month: false   # single DuckDB pass — faster than 13 repeated scans of 40k shards
  # Uniform per-ticker stride is applied INSIDE build_sequences so peak RAM
  # stays bounded to ~max_samples * seq_len * n_features * 4 bytes (float32).
  # 10M samples -> X ~= 6.4 GB, comfortable on a 32 GB VM after accounting for
  # the in-memory trades DataFrame (~5-8 GB) and training-time overhead.
  max_samples: 10_000_000
  # Uncomment after running scripts/prepare_data.py (cuts load time from hours to seconds):
  # polymarket_consolidated: data/polymarket/consolidated/trades_with_timestamps.parquet

platform: polymarket

sequence:
  length: 32
  min_trades_per_market: 100

target:
  type: next_price
  horizon: 1

split:
  train_frac: 0.6
  val_frac: 0.2
  test_frac: 0.2

normalize_features: true

models:
  baseline_last_price: true
  baseline_vwap: true
  mlp: true
  lstm: true

training:
  batch_size: 512
  epochs: 50
  lr: 0.001
  early_stopping_patience: 7
  device: cpu
  seed: 42

mlp:
  hidden: [128, 64, 32]
  dropout: 0.2

lstm:
  hidden: 128
  num_layers: 2
  dropout: 0.2

output:
  dir: output/run_12m_singlepass
  save_models: true
  save_metrics: true
