seed: 42

data:
  polymarket_trades: data/polymarket/trades
  polymarket_blocks: data/polymarket/blocks
  polymarket_markets: data/polymarket/markets
  last_n_months: 6
  exclude_sports: true
  polymarket_sports_tickers_file: data/polymarket/sports_tickers.txt
  batch_by_month: false   # single DuckDB pass over the consolidated file
  polymarket_consolidated: data/polymarket/consolidated/trades_with_timestamps.parquet
  # Safety cap so the on-disk sequence store stays ≤ ~13 GB.
  # With last_n_months=6 the raw window count is ~245 M; stride is applied only
  # when it exceeds max_samples, so all markets and time periods stay represented.
  # Remove this line (or set it to null) once you have verified disk space > 30 GB free.
  max_samples: 20_000_000

platform: polymarket

sequence:
  length: 32
  min_trades_per_market: 100

target:
  type: next_price
  horizon: 1

split:
  train_frac: 0.6
  val_frac: 0.2
  test_frac: 0.2

normalize_features: true

models:
  baseline_last_price: true
  baseline_vwap: true
  mlp: true
  lstm: true

training:
  batch_size: 512
  epochs: 50
  lr: 0.001
  early_stopping_patience: 7
  device: cpu
  seed: 42
  # X/y written to disk as numpy memmap: peak training RAM = O(batch_size), not O(n_samples).
  # The folder is created inside output.dir.  Delete it to force a rebuild.
  sequences_dir: sequences

mlp:
  hidden: [128, 64, 32]
  dropout: 0.2

lstm:
  hidden: 128
  num_layers: 2
  dropout: 0.2

output:
  dir: output/run_6m
  save_models: true
  save_metrics: true
