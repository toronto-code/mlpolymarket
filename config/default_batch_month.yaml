seed: 42
data:
  polymarket_trades: data/polymarket/trades
  polymarket_blocks: data/polymarket/blocks
  polymarket_markets: data/polymarket/markets
  last_n_months: 12
  exclude_sports: true
  polymarket_sports_tickers_file: data/polymarket/sports_tickers.txt
  batch_by_month: true
  # Hard cap on the number of sequence windows kept after build_sequences.
  # This is the primary RAM bottleneck control: X uses
  #   max_samples × seq_len × n_features × 4 bytes  (float32).
  # With seq_len=32 and 5 features, rough sizes are:
  #     500_000  →  ~0.3 GB   (safe on any VM)
  #   1_000_000  →  ~0.6 GB   (comfortable on 8 GB RAM)
  #   2_000_000  →  ~1.2 GB   (fine on 16 GB RAM)
  # Samples are chosen by uniform temporal stride so all time periods are
  # represented.  Remove or increase the limit once you have a larger VM.
  max_samples: 1_000_000
platform: polymarket
sequence:
  length: 32
  min_trades_per_market: 100
target:
  type: next_price
  horizon: 1
split:
  train_frac: 0.6
  val_frac: 0.2
  test_frac: 0.2
normalize_features: true
models:
  baseline_last_price: true
  baseline_vwap: true
  mlp: true
  lstm: true
training:
  batch_size: 256
  epochs: 50
  lr: 0.001
  early_stopping_patience: 7
  device: cpu
  seed: 42
mlp:
  hidden:
  - 128
  - 64
  - 32
  dropout: 0.2
lstm:
  hidden: 128
  num_layers: 2
  dropout: 0.2
output:
  dir: output
  save_models: true
  save_metrics: true
